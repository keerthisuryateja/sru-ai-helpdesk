<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR University | Helpdesk Data Administration</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Admin Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="/admin" class="brand-section">
        <div class="brand-logo-wrapper">
          <img src="/static/sru_logo.png" alt="SR University Logo" class="brand-logo">
        </div>
        <div class="brand-titles">
          <h1>SR University</h1>
          <div class="brand-subtitle">Relational Knowledgebase Admin</div>
        </div>
      </a>

      <div class="header-actions">
        <a href="/" class="btn btn-outline btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Voice Chat
        </a>
        <button class="btn btn-outline btn-icon" id="themeToggleBtn" title="Toggle Theme">
          <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Admin Main Content -->
  <main class="admin-container">
    <div class="admin-header-row">
      <div>
        <h2>University Database Records</h2>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Manage the relational tables queried by the AI Helpdesk RAG pipeline.</p>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-primary btn-sm" id="addNewBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Record
        </button>
      </div>
    </div>

    <!-- Category Tabs (shadcn style) -->
    <div class="tabs-nav" id="categoryTabs">
      <button class="tab-btn active" data-tab="faculty">Faculty (<span id="countFaculty">0</span>)</button>
      <button class="tab-btn" data-tab="administrative">Administrative Personnel (<span id="countAdmin">0</span>)</button>
      <button class="tab-btn" data-tab="knowledge">Knowledge (<span id="countKnowledge">0</span>)</button>
      <button class="tab-btn" data-tab="clubs">Student Clubs (<span id="countClubs">0</span>)</button>
      <button class="tab-btn" data-tab="websites">College Websites (<span id="countWebsites">0</span>)</button>
    </div>

    <!-- Search & Filter Toolbar -->
    <div class="admin-toolbar">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="adminSearchInput" class="search-input" placeholder="Filter records in current view..." oninput="handleSearch(event)">
      </div>
      <div style="font-size: 0.8rem; color: var(--text-secondary);" id="filterInfo">
        Showing all entries
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="table-container">
      <table class="data-table" id="crudTable">
        <thead id="tableHead">
          <!-- Dynamically injected -->
        </thead>
        <tbody id="tableBody">
          <!-- Dynamically injected -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add / Edit Modal Dialog -->
  <div class="modal-backdrop" id="crudModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Record</h3>
        <button class="btn btn-outline btn-icon" onclick="closeModal()" style="border: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="modalForm" onsubmit="handleFormSubmit(event)">
        <div class="modal-body" id="modalFormFields">
          <!-- Dynamically populated according to active category -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSaveBtn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/admin.js"></script>
</body>
</html>
